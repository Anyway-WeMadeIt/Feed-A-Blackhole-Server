# 사이트 설정(인증서 적용 전 모양). 앱으로 프록시한다.
# <도메인>을 실제 도메인으로 바꿔 /etc/nginx/conf.d/blackhole.conf에 둔다(절차는 README.md).
# certbot(--nginx)이 이 파일에 443 서버 블록, 인증서 경로, HTTP -> HTTPS 리다이렉트를 자동으로 추가한다.
# 그 뒤 "# managed by Certbot" 줄은 갱신 때 certbot이 다시 쓰므로 직접 고치지 않는다.

# 앱으로 가는 연결을 재사용한다(keepalive). 없으면 Nginx가 요청마다 새 TCP 연결을 만들어, 초당 수백 건에서 연결 생성 비용
# (커널, Docker의 docker-proxy)이 서버 CPU를 크게 쓰고 TIME_WAIT가 수천 개 쌓인다(부하 테스트, loadtest/README.md).
# keepalive_timeout은 앱(Tomcat)이 유휴 연결을 끊는 시간보다 짧게 둬서, 이미 끊긴 연결을 재사용하는 일을 피한다.
upstream blackhole_app {
    server 127.0.0.1:8080;
    keepalive 64;
    keepalive_timeout 30s;
}

server {
    listen 80;
    server_name <도메인>;

    location / {
        # 앱 포트(8080)는 서버 내부(127.0.0.1)에만 열려 있다. 외부에서는 Nginx만 접근한다.
        proxy_pass http://blackhole_app;
        # 업스트림 keepalive에 필요하다: HTTP/1.1로 말하고, 연결을 닫으라는 Connection 헤더를 지운다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 앱의 forward-headers-strategy=framework가 이 헤더들로 원래 클라이언트 정보(IP, https 여부)를 복원한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
