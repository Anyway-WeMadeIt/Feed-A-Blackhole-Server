# 사이트 설정(인증서 적용 전 모양). 앱으로 프록시한다.
# <도메인>을 실제 도메인으로 바꿔 /etc/nginx/conf.d/blackhole.conf에 둔다(절차는 README.md).
# certbot(--nginx)이 이 파일에 443 서버 블록, 인증서 경로, HTTP -> HTTPS 리다이렉트를 자동으로 추가한다.
# 그 뒤 "# managed by Certbot" 줄은 갱신 때 certbot이 다시 쓰므로 직접 고치지 않는다.
server {
    listen 80;
    server_name <도메인>;

    location / {
        # 앱 포트(8080)는 서버 내부(127.0.0.1)에만 열려 있다. 외부에서는 Nginx만 접근한다.
        proxy_pass http://127.0.0.1:8080;
        # 앱의 forward-headers-strategy=framework가 이 헤더들로 원래 클라이언트 정보(IP, https 여부)를 복원한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
