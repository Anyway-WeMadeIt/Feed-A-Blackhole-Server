# 인증 경로(/api/v1/auth/)의 요청 빈도를 같은 클라이언트 IP 기준으로 제한한다.
# 토큰 없이 열려 있는 이 경로 중 guest/register는 DB에 계정을 만들기 때문에, 스크립트 한 대가 반복 호출하면 DB가 계속 쌓인다.
# /etc/nginx/conf.d/에 두면 http 영역에 포함되므로 blackhole.conf(certbot이 고치는 파일)를 건드리지 않고 적용된다.
#
# 키가 빈 문자열이면 제한 대상이 아니다. 그래서 map으로 대상 경로에만 IP를 키로 주고, 나머지 경로(다른 API, 헬스체크)는 영향이 없다.
# Nginx 앞에 로드밸런서나 CDN이 없어서 $binary_remote_addr가 곧 클라이언트의 실제 IP다(앞단을 두면 real_ip 설정이 필요하다).
map $uri $limit_register {
    default "";
    /api/v1/auth/guest/register $binary_remote_addr;
}

map $uri $limit_auth {
    default "";
    ~^/api/v1/auth/ $binary_remote_addr;
}

# 평상시 한도: register는 IP당 분당 10회, 인증 경로 전체는 분당 60회.
# 통신사나 학원·동아리 같은 공유 네트워크의 IP를 여러 사람이 나눠 쓸 수 있어서 넉넉하게 잡았다.
limit_req_zone $limit_register zone=register:10m rate=10r/m;
limit_req_zone $limit_auth     zone=auth:10m     rate=60r/m;

# burst: 한도를 넘어 한꺼번에 몰리는 요청을 이만큼까지 받아 준다. 그보다 많으면 429를 돌려준다.
# 두 규칙은 모두 통과해야 하고, guest/register는 둘 다에 해당한다.
limit_req zone=register burst=20 nodelay;
limit_req zone=auth     burst=30 nodelay;
limit_req_status 429;
# 거부는 error.log에 warn으로 남는다(기본값 error는 알림성 로그와 섞인다).
limit_req_log_level warn;
