# 우리 도메인이 아닌 이름이나 IP로 온 HTTPS 요청을 앱까지 넘기지 않는다.
# 이 파일이 없으면 443의 유일한 서버 블록이 어떤 요청이든 받아서 앱으로 프록시한다(스캐너 트래픽이 앱에 닿는다).
server {
    # 다른 서버 블록(우리 도메인)에 맞지 않는 연결을 받는 기본 서버
    listen 443 ssl default_server;
    # SNI가 없거나 우리 도메인이 아닌 연결은 인증서 없이 TLS 핸드셰이크 단계에서 거부한다.
    # 정상 클라이언트(브라우저, Unity)는 SNI를 보내므로 영향이 없다.
    ssl_reject_handshake on;
    # SNI는 우리 도메인인데 Host 헤더만 다른 요청은 핸드셰이크를 통과한다.
    # 이 서버 블록에는 root가 없어 기본 환영 페이지를 내주게 되므로, 응답 없이 연결을 닫는다(444는 Nginx 전용 코드).
    return 444;
}
