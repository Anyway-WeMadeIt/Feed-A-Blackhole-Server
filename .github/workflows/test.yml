# 전체 테스트(스프링, Testcontainers의 MySQL, E2E 포함)를 실행한다. 코드 스타일 검사(code-style.yml)와 분리해서,
# 한쪽이 실패해도 다른 쪽 결과가 보이고 브랜치 보호의 필수 검사도 따로 지정할 수 있다.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치(PR)에 새 푸시가 오면 앞서 돌던 실행을 취소한다
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 브랜치 보호의 필수 검사는 이 잡 이름(Test)으로 지정한다
    name: Test
    # ubuntu-latest에는 Docker가 기본으로 있어서 Testcontainers가 MySQL(mysql:8.4)을 그대로 띄운다
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # .env나 시크릿이 필요 없다: build.gradle이 테스트용 JWT_SECRET과 샘플 콘텐츠 위치를 이미 지정한다
      - name: Run tests
        run: bash ./gradlew --no-daemon test
      # 테스트가 실패했을 때만 리포트를 올려서 원인을 내려받아 볼 수 있게 한다
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
