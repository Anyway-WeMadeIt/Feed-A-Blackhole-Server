spring.application.name=Feed-A-Blackhole-Server

# 로컬 개발: 프로젝트 루트의 .env(.env.example 참고)를 읽는다. 없으면 무시하고 실제 환경변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

# DB 접속. 배포 환경에서는 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로 덮어쓴다. 비밀번호 기본값은 두지 않는다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:feedablackhole}}
spring.datasource.username=${DB_USERNAME:blackhole}
spring.datasource.password=${DB_PASSWORD:}

# 스키마는 Flyway(src/main/resources/db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
