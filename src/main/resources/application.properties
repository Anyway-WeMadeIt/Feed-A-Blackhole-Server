spring.application.name=Feed-A-Blackhole-Server

# 로컬 개발: 프로젝트 루트의 .env(.env.example 참고)를 읽는다. 없으면 무시하고 실제 환경변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

# DB 접속. 배포 환경에서는 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로 덮어쓴다. 비밀번호 기본값은 두지 않는다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:feedablackhole}}
spring.datasource.username=${DB_USERNAME:blackhole}
spring.datasource.password=${DB_PASSWORD:}

# 스키마는 Flyway(src/main/resources/db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
# validate는 기본적으로 테이블·컬럼의 존재와 타입만 본다. 엔티티에 옮겨 적은 유니크 제약과 인덱스가 SQL(Flyway)과 같은지도 검증한다(Hibernate 7.3+).
spring.jpa.properties.hibernate.tooling.schema.unique_key_validation=ALL
spring.jpa.properties.hibernate.tooling.schema.index_validation=ALL
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# DB 연결 성능(부하 테스트로 확인, loadtest/README.md).
# 풀이 연결을 auto-commit 끈 상태로 내주고 Hibernate가 그것을 믿게 한다. 안 그러면 트랜잭션마다 SET autocommit이 두 번 나간다.
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
# 같은 SQL 문장의 해석 결과를 캐시한다(드라이버가 매 문장마다 SQL 글자를 훑지 않게 한다).
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
# 읽기 전용 여부 같은 세션 상태를 드라이버가 서버에 묻지 않고 자기가 아는 값으로 답한다(트랜잭션마다 나가던 SELECT @@SESSION.transaction_read_only가 없어진다).
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
# JDBC 배치 INSERT를 다중 행 INSERT 하나로 합쳐 보낸다(sync_log, SyncLogBatchWriter).
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# 운영 환경(Nginx 뒤의 컨테이너). 종료 신호를 받으면 처리 중인 요청을 마친 뒤 내려가고, 프록시가 넘긴 X-Forwarded-* 헤더를 따른다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

# 헬스체크. health만 웹에 노출하고 상세 정보(DB 종류, 디스크 등)는 숨긴다. DB에 연결되지 않으면 DOWN(503)이 된다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT. 서명 키(secret)는 32자 이상이어야 하고, 기본값 없이 환경변수 JWT_SECRET(로컬은 .env)으로만 주입한다. 비어 있으면 서버가 시작되지 않는다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=feed-a-blackhole
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
